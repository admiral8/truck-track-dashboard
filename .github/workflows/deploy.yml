name: Deploy Dashboard to GitHub Pages # str

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      
      - name: Checkout repository
        uses: actions/checkout@v4

      
      - name: Generate Mapbox config
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
        run: |
          test -n "$MAPBOX_PUBLIC_TOKEN"
          printf 'const MAPBOX_TOKEN = "%s";\n' "$MAPBOX_PUBLIC_TOKEN" > docs/config.js

      
      - name: Configure Pages
        uses: actions/configure-pages@v5

      
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4